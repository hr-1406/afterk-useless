<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TAB JAIL TETRIS</title>
    <link rel="stylesheet" href="tetris.css">
</head>
<body>
    <div id="tetris-container">
        <h1>JAILBREAK TETRIS</h1>
        <div id="game-board">
            <canvas id="tetris" width="240" height="400"></canvas>
            <div id="side-panel">
                <div class="panel-box">
                    <div>LINES</div>
                    <div id="lines-cleared">0 / 3</div>
                </div>
                <div id="status-msg">Clear 3 lines to escape!</div>
            </div>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>
</html>
